<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calmly AI Extension Test Bench</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
        }

        .editor {
            border: 1px solid #ccc;
            padding: 20px;
            min-height: 150px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <h1>Calmly AI Test Bench</h1>
    <p>Use this page to test if the extension is active and working correctly.</p>

    <h3>Test 1: ContentEditable Div (Like Gmail)</h3>
    <div class="editor" contenteditable="true">
        Type something angry here to test the extension...
        Example: This is completely stupid and useless.
    </div>

    <h3>Test 2: Textarea (Like many forms)</h3>
    <textarea placeholder="Type angry message here..."></textarea>
</body>

</html>
